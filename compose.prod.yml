# Full self-host topology for staging/small production-style deployments.
# It is intentionally documented as a starter, not a substitute for HA/TLS/managed backups.
name: lyreo

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file:
      - infra/docker/.env
    environment:
      KEYCLOAK_DB: ${KEYCLOAK_DB:-lyreo_keycloak}
    volumes:
      # PostgreSQL 18+ places data in a version-specific subdirectory (e.g. /var/lib/postgresql/18/main).
      # Mount at the parent so pg_upgrade can work without crossing mount-point boundaries.
      - lyreo-postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: ["start", "--http-enabled=true", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - infra/docker/.env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-lyreo_keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-lyreo}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # The edge exposes Keycloak below /auth in this starter.
      KC_HTTP_RELATIVE_PATH: /auth
      LYREO_CORE_CLIENT_SECRET: ${LYREO_CORE_CLIENT_SECRET:?set LYREO_CORE_CLIENT_SECRET}
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 30

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    restart: unless-stopped
    env_file:
      - services/ai-service/.env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 10

  core-service:
    build:
      context: .
      dockerfile: apps/core-service/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/core-service/.env
    environment:
      # Infrastructure addresses override local-host values from the service .env file.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lyreo}
      DATABASE_USERNAME: ${POSTGRES_USER:-lyreo}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      # JWT issuer stays PUBLIC, but signing keys are fetched over the internal network.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost/auth}/realms/lyreo
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/lyreo/protocol/openid-connect/certs
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        # Relative URLs make the static bundle portable behind the edge container.
        VITE_API_BASE_URL: ""
        VITE_KEYCLOAK_URL: /auth
        VITE_KEYCLOAK_REALM: lyreo
        VITE_KEYCLOAK_CLIENT_ID: lyreo-admin-web
    restart: unless-stopped

  edge:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/lyreo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core-service
      - admin-web
      - keycloak

volumes:
  lyreo-postgres-data:
