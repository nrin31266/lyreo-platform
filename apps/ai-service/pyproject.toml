[project]
name = "lyreo-ai-service"
version = "0.1.0"
description = "AI capability runtime for Lyreo. No business orchestration lives here."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "azure-cognitiveservices-speech<2",
]

[project.optional-dependencies]
# Faster-whisper 1.2.1 uses an audio decoding argument removed in PyAV 19.
whisperx = ["whisperx==3.8.6", "ctranslate2==4.7.1", "av<19"]
kokoro = ["kokoro>=0.9,<1", "torch>=2.7"]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
default-groups = []
