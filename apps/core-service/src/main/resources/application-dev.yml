# Development profile overrides for Lyreo Core Service
# Automatically activated when SPRING_PROFILES_ACTIVE=dev

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

lyreo:
  lesson:
    timing:
      reuse-draft: ${LESSON_TIMING_REUSE_DRAFT:true}
