server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lyreo-core-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lyreo_dev}
    username: ${DATABASE_USERNAME:lyreo}
    password: ${DATABASE_PASSWORD:lyreo_dev_password}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/lyreo}
          # Production reverse-proxy deployments may expose a public issuer but fetch JWKs
          # over the internal Docker network. Keep both configurable instead of weakening issuer validation.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/lyreo/protocol/openid-connect/certs}

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      # Keep restart republish opt-in. Spring Modulith warns against enabling it blindly
      # in multi-instance deployments because another instance may still own the publication.
      republish-outstanding-events-on-restart: ${MODULITH_REPUBLISH_OUTSTANDING_ON_RESTART:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

lyreo:
  jobs:
    poll-interval-ms: ${JOB_POLL_INTERVAL_MS:1000}
    recover-interval-ms: ${JOB_RECOVER_INTERVAL_MS:30000}
    lease-seconds: ${JOB_LEASE_SECONDS:60}
    claim-batch-size: ${JOB_CLAIM_BATCH_SIZE:5}

  storage:
    mode: ${STORAGE_MODE:local}
    local-root: ${LOCAL_STORAGE_ROOT:../../.data/storage}
    endpoint: ${R2_ENDPOINT:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:lyreo-dev}
    region: ${R2_REGION:auto}

  security:
    master-encryption-key: ${MASTER_ENCRYPTION_KEY}
    dev-bootstrap-token: ${DEV_BOOTSTRAP_TOKEN:disabled}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  rate-limit:
    tokens-per-minute: ${API_RATE_LIMIT_TOKENS_PER_MINUTE:120}
    max-client-keys: ${API_RATE_LIMIT_MAX_CLIENT_KEYS:100000}

  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-token: ${AI_SERVICE_INTERNAL_TOKEN}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:300}

  lesson:
    youtube:
      # External media materialization is opt-in per environment. It runs in Core, not FastAPI.
      enabled: ${YOUTUBE_MEDIA_TOOL_ENABLED:false}
      command: ${YOUTUBE_MEDIA_TOOL_COMMAND:yt-dlp}
      timeout-seconds: ${YOUTUBE_MEDIA_TOOL_TIMEOUT_SECONDS:300}
