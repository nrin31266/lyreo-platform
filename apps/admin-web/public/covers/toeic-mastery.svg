<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="bgPro" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13112B"/>
      <stop offset="52%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="320" cy="175" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#13112B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldArc" x1="210" y1="90" x2="430" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="indigoPanel" x1="210" y1="68" x2="430" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgPro)"/>
  <rect width="640" height="360" fill="url(#amberGlow)"/>

  <!-- Precision meridian arcs -->
  <circle cx="320" cy="180" r="154" stroke="#818CF8" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="320" cy="180" r="126" stroke="#FBBF24" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="4 6"/>
  <line x1="96" y1="180" x2="544" y2="180" stroke="#818CF8" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Left & right multi-passage document wings -->
  <rect x="156" y="102" width="116" height="156" rx="14" transform="rotate(-7 156 102)" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="368" y="92" width="116" height="156" rx="14" transform="rotate(7 368 92)" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Central mastery console -->
  <rect x="212" y="62" width="216" height="236" rx="22" fill="url(#indigoPanel)" stroke="#6366F1" stroke-opacity="0.48" stroke-width="1.5"/>

  <!-- Dual Listening / Reading precision gauge -->
  <path d="M254 184C254 147.549 283.549 118 320 118C356.451 118 386 147.549 386 184" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <path d="M254 184C254 147.549 283.549 118 320 118C349.5 118 374.5 137.3 383 164" stroke="url(#goldArc)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="383" cy="164" r="7" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>

  <!-- Center compass / milestone diamond -->
  <g transform="translate(320, 168)">
    <polygon points="0,-24 18,0 0,24 -18,0" fill="url(#goldArc)"/>
    <polygon points="0,-13 9,0 0,13 -9,0" fill="#FFFBEB"/>
  </g>

  <!-- Dual section breakdown bars (Listening + Reading) -->
  <g transform="translate(238, 212)">
    <rect x="0" y="0" width="76" height="36" rx="9" fill="#1E293B" stroke="#475569"/>
    <rect x="12" y="11" width="32" height="5" rx="2.5" fill="#93C5FD"/>
    <rect x="12" y="21" width="52" height="6" rx="3" fill="#38BDF8"/>

    <rect x="88" y="0" width="76" height="36" rx="9" fill="#1E293B" stroke="#475569"/>
    <rect x="100" y="11" width="32" height="5" rx="2.5" fill="#FDE68A"/>
    <rect x="100" y="21" width="56" height="6" rx="3" fill="#F59E0B"/>
  </g>

  <!-- Top & bottom accent rules -->
  <rect x="284" y="84" width="72" height="6" rx="3" fill="#6366F1" fill-opacity="0.65"/>
  <rect x="262" y="268" width="116" height="8" rx="4" fill="#334155"/>
  <rect x="262" y="268" width="98" height="8" rx="4" fill="url(#goldArc)"/>
</svg>
