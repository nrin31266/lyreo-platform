<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="bgA1" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="55%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <radialGradient id="a1Glow" cx="320" cy="180" r="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ECFDF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starterSheet" x1="216" y1="64" x2="424" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="waveEmerald" x1="256" y1="133" x2="390" y2="133" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgA1)"/>
  <rect width="640" height="360" fill="url(#a1Glow)"/>

  <!-- Fresh daylight geometric circles -->
  <circle cx="164" cy="92" r="92" fill="#A7F3D0" fill-opacity="0.45"/>
  <circle cx="484" cy="272" r="106" fill="#BAE6FD" fill-opacity="0.45"/>

  <!-- Subtle pacing rings -->
  <circle cx="320" cy="180" r="142" stroke="#10B981" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 7"/>
  <circle cx="320" cy="180" r="108" stroke="#059669" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Back angled starter folio -->
  <rect x="196" y="76" width="212" height="214" rx="18" transform="rotate(-5 196 76)" fill="#0F766E" stroke="#5EEAD4" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Main beginner workbook sheet -->
  <rect x="216" y="64" width="208" height="232" rx="20" fill="url(#starterSheet)" stroke="#A7F3D0" stroke-width="1.5"/>

  <!-- Header bar & warm amber starter pill -->
  <rect x="236" y="86" width="82" height="10" rx="5" fill="#047857"/>
  <rect x="368" y="83" width="36" height="16" rx="8" fill="#FEF3C7"/>
  <circle cx="386" cy="91" r="4.5" fill="#F59E0B"/>

  <!-- Slow-listening acoustic strip (clean, evenly spaced waves) -->
  <rect x="236" y="110" width="168" height="46" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <g stroke="url(#waveEmerald)" stroke-width="4" stroke-linecap="round">
    <line x1="258" y1="138" x2="258" y2="128"/>
    <line x1="274" y1="142" x2="274" y2="124"/>
    <line x1="290" y1="146" x2="290" y2="120"/>
    <line x1="306" y1="140" x2="306" y2="126"/>
    <line x1="322" y1="145" x2="322" y2="121"/>
    <line x1="338" y1="141" x2="338" y2="125"/>
    <line x1="354" y1="144" x2="354" y2="122"/>
    <line x1="370" y1="139" x2="370" y2="127"/>
    <line x1="386" y1="137" x2="386" y2="129"/>
  </g>

  <!-- 3 stepping-stone A1 milestone rows -->
  <g>
    <circle cx="248" cy="180" r="8" fill="#10B981"/>
    <path d="M244.5 180.2L247 182.7L251.8 177.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="266" y="176" width="94" height="8" rx="4" fill="#1E293B"/>
    <rect x="370" y="176" width="32" height="8" rx="4" fill="#94A3B8"/>

    <circle cx="248" cy="208" r="8" fill="#0D9488"/>
    <circle cx="248" cy="208" r="3" fill="#FFFFFF"/>
    <rect x="266" y="204" width="84" height="8" rx="4" fill="#334155"/>
    <rect x="360" y="204" width="42" height="8" rx="4" fill="#99F6E4"/>

    <circle cx="248" cy="236" r="7.25" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="266" y="232" width="76" height="8" rx="4" fill="#94A3B8"/>
    <rect x="352" y="232" width="50" height="8" rx="4" fill="#CBD5E1"/>
  </g>

  <!-- Bottom beginner progress track -->
  <rect x="236" y="264" width="168" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="236" y="264" width="92" height="10" rx="5" fill="url(#emeraldAccent)"/>

  <!-- Floating vocabulary flashcard pill on left -->
  <g transform="translate(154, 126)">
    <rect x="0" y="0" width="78" height="54" rx="14" fill="#065F46" stroke="#6EE7B7" stroke-opacity="0.65" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="4.5" fill="#FBBF24"/>
    <rect x="30" y="16.5" width="34" height="7" rx="3.5" fill="#ECFDF5"/>
    <rect x="14" y="32" width="50" height="7" rx="3.5" fill="#6EE7B7" fill-opacity="0.8"/>
  </g>

  <!-- Floating slow-audio headphone emblem badge on right -->
  <g transform="translate(394, 196)">
    <rect x="0" y="0" width="76" height="76" rx="20" fill="#064E3B" stroke="#34D399" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M22 42V36C22 27.163 29.163 20 38 20C46.837 20 54 27.163 54 36V42" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="18" y="39" width="9" height="16" rx="4.5" fill="#ECFDF5"/>
    <rect x="49" y="39" width="9" height="16" rx="4.5" fill="#ECFDF5"/>
  </g>
</svg>
