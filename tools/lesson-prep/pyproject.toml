[project]
name = "lyreo-lesson-prep"
version = "0.1.0"
description = "Operator tool: acquire, transcribe, align and export prepared Lyreo lesson sources."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120,<1",
  "gradio>=5,<6",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
default-groups = []
