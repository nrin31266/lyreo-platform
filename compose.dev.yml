# Lyreo development infrastructure only.
# Application source (Core/FastAPI/Admin/Mobile) intentionally runs on the host for fast debug/hot reload.
name: lyreo

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: lyreo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lyreo_dev}
      POSTGRES_USER: ${POSTGRES_USER:-lyreo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyreo_dev_password}
      # Read by infra/postgres/init/01-create-keycloak-db.sh on first volume initialization.
      KEYCLOAK_DB: ${KEYCLOAK_DB:-lyreo_keycloak}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lyreo-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lyreo} -d ${POSTGRES_DB:-lyreo_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: lyreo-keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-lyreo_keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-lyreo}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-lyreo_dev_password}
      KC_HEALTH_ENABLED: "true"
      # Placeholder in realm import is finalized by bootstrap-keycloak.sh.
      LYREO_CORE_CLIENT_SECRET: ${LYREO_CORE_CLIENT_SECRET:-lyreo-local-core-secret-change-me}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak image does not guarantee curl; bash /dev/tcp is sufficient for dependency ordering here.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 30

volumes:
  lyreo-postgres-data:
