name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline repository guardrails
        run: make validate
      - name: Tooling tests
        run: make test-tooling

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Install audio verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: make verify-java

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: importer_test
          POSTGRES_PASSWORD: importer_test
          POSTGRES_DB: importer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U importer_test -d importer_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: AI Service tests
        run: make test-ai
      - name: Data importer tests
        env:
          IMPORT_TEST_DATABASE_URL: postgresql://importer_test:importer_test@localhost:5432/importer_test
        run: make test-data-import

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: make typecheck
      - run: make test-frontend
      - run: make build-web
