name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline repository guardrails
        run: make validate
      - name: Tooling tests
        run: make test-tooling

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - run: make verify-java

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: AI Service tests
        run: make test-ai
      - name: Data importer tests
        run: make test-data-import
      - name: Lesson Prep tests
        run: make test-lesson-prep

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: make typecheck
      - run: make test-frontend
      - run: make build-web
