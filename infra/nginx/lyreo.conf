# Starter edge for self-host compose. Terminate TLS in front of this file or replace with
# your production ingress/reverse proxy. Forwarded headers are required by Keycloak.
server {
  listen 80;
  server_name _;
  client_max_body_size 32m;

  location /api/ {
    proxy_pass http://core-service:8080;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
  }

  location /actuator/ {
    proxy_pass http://core-service:8080;
    proxy_set_header Host $host;
  }

  # Keycloak itself is configured with KC_HTTP_RELATIVE_PATH=/auth.
  location /auth/ {
    proxy_pass http://keycloak:8080/auth/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://admin-web:80;
    proxy_set_header Host $host;
  }
}
